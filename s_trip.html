  var book = el("div", "pbook", stage); book.style.left = bx + "px"; book.style.top = by + "px"; book.style.width = pw * 2 + "px"; book.style.height = ph + "px";
  S.book = book; S.bk = {pw:pw, ph:ph, bx:bx, by:by};
  var right = el("div", "ppage r", book); right.style.left = pw + "px"; right.style.width = pw + "px";
  var t2 = el("div", "ttl", right); t2.textContent = "下一站  NEXT"; t2.style.fontSize = ph * .035 + "px";
  var slot = el("div", "slot", right); slot.style.fontSize = ph * .05 + "px"; slot.innerHTML = "这里，<br>还空着"; S.slot = slot;
  var tks = el("div", "pticks", book); tks.style.left = pw + "px"; tks.style.width = pw + "px";
  S.stamps.forEach(function(t, i){ tuck(tks, i, pw); });
  var leaf = el("div", "pleaf", book); leaf.style.left = pw + "px"; leaf.style.width = pw + "px"; leaf.style.zIndex = 3;
  var fr = el("div", "pface", leaf); var ci = el("img", "", fr); ci.alt = "护照"; ci.src = "e/passport.webp"; ci.style.cssText += ";left:0;top:0;width:100%;height:100%";
  var bk = el("div", "pface back ppage l", leaf); bk.style.position = "absolute"; bk.style.left = "0"; bk.style.width = "100%";
  var t1 = el("div", "ttl", bk); t1.textContent = "入境记录  ENTRIES"; t1.style.fontSize = ph * .035 + "px";
  var sz = pw * .4, pos = [[.08, .2], [.52, .22], [.1, .56], [.52, .58]];
  S.stamps.forEach(function(t, i){ var s = stamp(bk, t, sz, [-10, 8, 6, -6][i]); s.style.left = pos[i][0] * pw + "px"; s.style.top = pos[i][1] * ph + "px"; });
  /* 从右下角飞过来（合着），再翻开 */
  var r = S.pc.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  var cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2, k = r.height / ph;
  var from = "translate(" + (cx - (bx + pw * 1.5)) + "px," + (cy - (by + ph / 2)) + "px) scale(" + k + ") rotate(-7deg)";
  var closed = "translate(" + (-pw / 2) + "px,0px)";
  S.pc.style.opacity = "0";
  book.style.transformOrigin = (pw * 1.5) + "px 50%";
  book.animate([{transform:from}, {transform:closed}], {duration:650, easing:"cubic-bezier(.3,.8,.3,1)", fill:"forwards"}).onfinish = function(){
    later(function(){
      book.animate([{transform:closed}, {transform:"none"}], {duration:800, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
      leaf.animate([{transform:"rotateY(0deg)"}, {transform:"rotateY(-180deg)"}], {duration:800, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
      noise(.3, 2200, .6, .1, "highpass");
      tks.animate([{transform:"none", opacity:1}, {transform:"translateY(-18%)", opacity:0}], {duration:600, easing:"ease-in", fill:"forwards"});
      later(function(){ S.phase = "stamp"; hint("点一下，盖下最后一个章"); }, 850);
    }, 200);
  };
}
function stampPassport(){
  S.phase = "busy"; hint("");
  var b = S.bk, w = b.pw * .62, h = heartStamp(S.book, w);
  h.style.left = (b.pw + (b.pw - w) / 2) + "px"; h.style.top = (b.ph * .3) + "px"; h.style.zIndex = 5;
  slam(h, -6, function(){ S.slot.animate([{opacity:1}, {opacity:0}], {duration:200, fill:"forwards"}); });
  later(function(){ giveTicket(true); }, 1100);
}

/* ================= 结尾：登机牌 ================= */
function buildPass(){
  var bw = L.W * .56, k = bw / M.boarding[0], bh = M.boarding[1] * k, bx = (L.W - bw) / 2, by = (L.H - bh) / 2 - L.H * .02;
  var bp = el("div", "bp", stage); bp.style.left = bx + "px"; bp.style.top = by + "px"; bp.style.width = bw + "px"; bp.style.height = bh + "px";
  var seam = M.seam * k, fs = bh * .085;
  function part(clip){
    var p = el("div", "bpart", bp); p.style.clipPath = clip;
    var im = el("img", "", p); im.alt = ""; im.src = "e/boarding.webp";
    var band = el("div", "band", p); band.textContent = "BOARDING PASS  登机牌"; band.style.left = 24 * k + "px"; band.style.top = 24 * k + "px"; band.style.fontSize = fs * .62 + "px";
    var bd2 = el("div", "band", p); bd2.textContent = "ONE WAY →"; bd2.style.left = (M.seam + 24) * k + "px"; bd2.style.top = 24 * k + "px"; bd2.style.fontSize = fs * .55 + "px";
    function f(x, y, label, val, size){ var e = el("div", "f", p); e.style.left = x * k + "px"; e.style.top = y * k + "px"; e.style.fontSize = (size || fs) + "px"; e.innerHTML = "<b></b><span></span>"; e.querySelector("b").textContent = label; e.querySelector("span").textContent = val; return e; }
    var BP = (window.CFG && CFG.trip && CFG.trip.bp) || {p:"你 & 我", f:"LOVE航班"};
    f(34, 80, "乘客 PASSENGER", BP.p);   /* 这一行一直空到撕口，两个 6 个字的名字也排得下 */
    f(34, 145, "出发 FROM", "今天");
    f(190, 145, "目的地 TO", "我们的以后", fs * 1.35);
    f(34, 205, "座位 SEAT", "12A · 12B");
    f(190, 205, "登机口 GATE", "随时");
    var ff = f(330, 205, "航班 FLIGHT", BP.f), fn = Array.from(BP.f).length; if (fn > 6) ff.querySelector("span").style.fontSize = Math.max(.6, 6 / fn) + "em";
    f(M.seam + 22, 196, "座位 SEAT", "12A · 12B", fs * .85);
    return p;
  }
  var main = part("inset(0 " + (bw - seam) + "px 0 0)"), stub = part("inset(0 0 0 " + seam + "px)");
  S.bp = {el:bp, main:main, stub:stub, bw:bw, bh:bh, bx:bx, by:by, seam:seam, k:k};
  return S.bp;
}
function giveTicket(fromPassport){
  S.phase = "busy"; hint(""); S.veil.classList.add("on");
  var p = buildPass();
  if (fromPassport) {
    p.el.style.zIndex = 54;
    p.el.animate([{transform:"translateY(-6%) scale(.55)", opacity:0}, {transform:"translateY(-6%) scale(.55)", opacity:1, offset:.15}, {transform:"translateY(28%) scale(.9)", opacity:1, offset:.55}, {transform:"none", opacity:1}], {duration:1300, easing:"cubic-bezier(.3,.7,.3,1)", fill:"forwards"});
    S.book.animate([{transform:"none", opacity:1}, {transform:"translateY(-30%) scale(.7)", opacity:.0}], {duration:900, delay:350, easing:"ease-in", fill:"forwards"});
    later(function(){ p.el.style.zIndex = 56; }, 700);
    noise(.5, 2600, .5, .08, "highpass");
    later(function(){ S.phase = "tear"; hint("按住票根，往下撕"); }, 1350);
  } else {
    p.el.animate([{transform:"translateY(" + L.H + "px) rotate(6deg)"}, {transform:"translateY(-3%) rotate(-1deg)", offset:.75}, {transform:"none"}], {duration:800, easing:"cubic-bezier(.3,.8,.3,1)", fill:"forwards"});
    noise(.4, 2600, .5, .08, "highpass");
    later(function(){ S.phase = "tear"; hint("按住票根，往下撕"); }, 850);
  }
}
function stampTicket(){
  S.phase = "busy"; hint("");
  var p = S.bp, w = p.bh * .62, h = heartStamp(p.main, w);
  h.style.left = (p.seam - w * 1.02) + "px"; h.style.top = (p.bh * .3) + "px";
  slam(h, -8);
  later(function(){ S.phase = "tear"; hint("按住票根，往下撕"); }, 800);
}
function tearDrag(dy){ var p = S.bp; dy = Math.max(0, dy); p.stub.style.transform = "translate(" + dy * .15 + "px," + dy * .6 + "px) rotate(" + dy * .08 + "deg)"; p.stub.style.transformOrigin = (p.seam) + "px 0px"; }
function tearOff(){
  S.phase = "busy"; hint(""); tear();
  var p = S.bp, cur0 = p.stub.style.transform || "none";
  p.stub.style.transformOrigin = p.seam + "px 0px";
  /* 票根落到右下角，留着当纪念 */
  var kw = L.W * .16, scale = kw / (p.bw - p.seam), tx = L.W * .97 - kw - (p.bx + p.seam), ty = L.H * .96 - p.bh * scale - p.by;
  var a = p.stub.animate([{transform:cur0}, {transform:"translate(" + p.bw * .03 + "px," + p.bh * .22 + "px) rotate(10deg)", offset:.3}, {transform:"translate(" + tx + "px," + ty + "px) scale(" + scale + ") rotate(-6deg)"}], {duration:1100, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
  later(function(){ p.main.animate([{transform:"none", opacity:1}, {transform:"translateY(-14%)", opacity:0}], {duration:600, easing:"ease-in", fill:"forwards"}); S.veil.classList.remove("on"); }, 500);
  later(function(){ p.el.style.zIndex = 63; finalFlight(); }, 1300);
}

/* ================= 最后一程：画一颗大心 ================= */
var HC = window.__HC || {x:285, y:244, k:2.7};     /* 在中间这片大西洋上画心（航线都绕开了这一块） */
function heartPts(){
  var pts = [];
  for (var n = 0; n <= 160; n++) { var t = n / 160 * Math.PI * 2;
    pts.push([HC.x + HC.k * 16 * Math.pow(Math.sin(t), 3), HC.y - HC.k * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]); }
  return pts;
}
function heartD(){ var p = heartPts(); return "M" + p.map(function(q){ return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L"); }
function finalFlight(){
  S.phase = "final";
  var pts = heartPts(), notch = pts[0];                    /* 从心顶的凹口开始画 */
  var hd = "M" + pts.map(function(q){ return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L");
  var e0 = B_TRIPS[B_TRIPS.length - 1], st = [e0.x, e0.y];
  Array.prototype.forEach.call(S.svg.querySelectorAll("path[stroke='#e0442c']"), function(pp){ pp.animate([{opacity:1}, {opacity:.25}], {duration:700, fill:"forwards"}); });
  flyAlong("M" + st[0] + " " + st[1] + " Q" + ((st[0] + notch[0]) / 2) + " " + (Math.min(st[1], notch[1]) - 40) + " " + notch[0].toFixed(1) + " " + notch[1].toFixed(1), 1300, function(){
    S.pscale = .55; S.fixedFace = true; if (Z0 > 1) S.camFix = [HC.x, HC.y + 2 * HC.k];
    flyAlong(hd, 3400, function(){ planeOut(); grow(); }, null, 0, "3.4");
  }, null, 0, "none");
}
/* 4. 画完心，飞机原地淡出 */
function planeOut(){ S.plane.animate([{opacity:1}, {opacity:0}], {duration:450, fill:"forwards", easing:"ease-out"}); }
function exitUp(n){
  var t0 = performance.now(), me = S;
  function f(now){
    if (me.dead) return; var p = Math.min(1, (now - t0) / 1100), e = p * p;
    var y = n[1] - e * 320; S.plane.style.transform = "translate(" + n[0] * L.mk + "px," + y * L.mk + "px) rotate(90deg) scale(" + .62 * (1 + 1.2 * e) + ")";
    S.plane.style.opacity = String(1 - Math.max(0, (p - .6) / .4));
    if (p < 1) requestAnimationFrame(f);
  }
  whoosh(.9); requestAnimationFrame(f);
}
/* 心画好以后：航线和城市点淡出，心慢慢变大到全屏 */
function grow(){
  var night = el("div", "night", stage);
  night.animate([{opacity:0}, {opacity:1}], {duration:770, fill:"forwards", easing:"ease-in-out"});
  S.svg.animate([{opacity:1}, {opacity:0}], {duration:495, fill:"forwards"});
  Array.prototype.forEach.call(S.world.querySelectorAll(".pin"), function(p){ p.animate([{opacity:1}, {opacity:0}], {duration:385, fill:"forwards"}); });
  var k = HC.k, x0 = HC.x - 16 * k - 6, x1 = HC.x + 16 * k + 6, y0 = HC.y - 12.4 * k - 6, y1 = HC.y + 17 * k + 6;
  var box = el("div", "", stage); box.style.cssText = "position:absolute;z-index:31;pointer-events:none;transform-origin:50% 50%";
  var cs = S.cam.s || 1, bl = L.mx + S.cam.tx + x0 * L.mk * cs, bt = L.my + S.cam.ty + y0 * L.mk * cs, bw = (x1 - x0) * L.mk * cs, bh = (y1 - y0) * L.mk * cs;
  box.style.left = bl + "px"; box.style.top = bt + "px"; box.style.width = bw + "px"; box.style.height = bh + "px";
  var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", x0 + " " + y0 + " " + (x1 - x0) + " " + (y1 - y0)); svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;overflow:visible";
  svg.innerHTML = '<defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="hf" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ff6a52" stop-opacity=".3"/><stop offset="1" stop-color="#e0442c" stop-opacity=".1"/></radialGradient></defs>';
  box.appendChild(svg);
  var dash = document.createElementNS(NS, "path"); dash.setAttribute("d", heartD() + " Z"); dash.setAttribute("fill", "none"); dash.setAttribute("stroke", "#e0442c"); dash.setAttribute("stroke-width", "3.4"); dash.setAttribute("stroke-dasharray", "8 5"); dash.setAttribute("stroke-linecap", "round");
  var solid = document.createElementNS(NS, "path"); solid.setAttribute("d", heartD() + " Z"); solid.setAttribute("fill", "url(#hf)"); solid.setAttribute("stroke", "#ff5a40"); solid.setAttribute("stroke-width", "1.5"); solid.setAttribute("filter", "url(#gl)"); solid.style.opacity = "0";
  svg.appendChild(solid); svg.appendChild(dash);
  var th = L.H * .8, sc = th / bh, dx = L.W / 2 - (bl + bw / 2), dy = L.H * .47 - (bt + bh / 2);
  later(function(){
    whoosh(1.2);
    box.animate([{transform:"none"}, {transform:"translate(" + dx + "px," + dy + "px) scale(" + sc + ")"}], {duration:935, easing:"cubic-bezier(.6,0,.25,1)", fill:"forwards"});
    dash.animate([{opacity:1}, {opacity:0}], {duration:495, delay:275, fill:"forwards"});
    solid.animate([{opacity:0}, {opacity:1}], {duration:495, delay:275, fill:"forwards"});
  }, 385);
  later(function(){
    thump(.8);
    box.animate([{transform:"translate(" + dx + "px," + dy + "px) scale(" + sc + ")"}, {transform:"translate(" + dx + "px," + dy + "px) scale(" + sc * 1.04 + ")"}, {transform:"translate(" + dx + "px," + dy + "px) scale(" + sc + ")"}], {duration:715, iterations:Infinity, easing:"ease-in-out"});
    endText();
  }, 1347);
}

/* 结尾：不画心了。地图慢慢暗下来，航线留着，飞机淡出，出字 */
function calmEnd(){
  S.phase = "final"; planeOut();
  var night = el("div", "night", stage); night.animate([{opacity:0}, {opacity:.82}], {duration:1500, fill:"forwards", easing:"ease-in-out"});
  Array.prototype.forEach.call(S.world.querySelectorAll(".pin"), function(p){ p.animate([{opacity:1}, {opacity:.3}], {duration:900, fill:"forwards"}); });
  later(endText, 1100);
}
function endText(){ if (S.bp && S.bp.el) S.bp.el.animate([{opacity:1}, {opacity:0}], {duration:700, fill:"forwards"}); setTimeout(function(){ window.wsp && wsp("总有一天我们能一起走完世界哒~（社畜心声）"); }, 1800);
  S.phase = "end";
  var cx = L.W / 2, cy = L.H * .47 + L.H * .03;
  var fsz = Math.max(24, L.H * .1);
  var t = el("p", "endt", stage); t.style.left = cx + "px"; t.style.top = (cy - fsz * 1.25) + "px"; t.style.fontSize = fsz + "px";
  var k = 0;
  ["下一站：", "我们的以后"].forEach(function(line, li){
    var row = el("div", "", t);
    Array.from(line).forEach(function(c){
      var sp = el("span", "ch", row); sp.textContent = c;
      sp.animate([{opacity:0, transform:"translateY(12px)"}, {opacity:1, transform:"none"}], {duration:280, delay:80 + k * 70, fill:"forwards", easing:"ease-out"}); k++;
    });
  });
  var sub = el("p", "endsub", stage); sub.style.top = (L.H * .9) + "px"; sub.style.fontSize = Math.max(14, L.H * .042) + "px";
  sub.textContent = ""; setTimeout(function(){ window.segDone&&segDone(); }, 900);
  sub.animate([{opacity:0}, {opacity:1}], {duration:600, delay:80 + k * 70 + 150, fill:"forwards"});
  later(function(){ thump(.7); }, 80 + k * 70);
}

/* ---------- 点击 ---------- */
function down(ev){
  if (!S || S.busy) return;
  var ph = S.phase;
  if (ph === "ready") { flyNext(); return; }
  if (ph === "memo") {
    var o = S.memo; if (!o.spread) { spreadMemo(o); return; } if (!o.ready || o.closing) return;
    S.phase = "closing"; S.veil.classList.remove("on"); closeMemo(o, afterMemo); return;
  }
  if (ph === "ending0") { if (cur === "passport") openPassport(); else giveTicket(false); return; }
  if (ph === "stamp") { if (cur === "passport" && !S.bp) stampPassport(); else stampTicket(); return; }
  if (ph === "tear") { S.tearY = ev.clientY; S.tearing = true; return; }
}
stage.addEventListener("pointerdown", function(ev){ ac(); stage.setPointerCapture(ev.pointerId); down(ev); });
stage.addEventListener("pointermove", function(ev){ if (S && S.tearing && S.phase === "tear") { var dy = ev.clientY - S.tearY; tearDrag(dy); if (dy > L.H * .12) { S.tearing = false; tearOff(); } } });
stage.addEventListener("pointerup", function(){ if (S && S.tearing && S.phase === "tear") { S.tearing = false; tearOff(); } });
stage.addEventListener("keydown", function(ev){ if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ac(); down(ev); if (S.tearing) { S.tearing = false; tearOff(); } } });

/* 直接跳到四站飞完 */
function skipToEnd(){
  reset();
  B_TRIPS.forEach(function(t, i){
    var P = addTrail(t.seg); P.m.setAttribute("stroke-dashoffset", 0); S.pins[i].classList.add("done");
    if (cur === "passport") S.stamps.push(t);
  });
  var e = B_TRIPS[B_TRIPS.length - 1]; placePlane(e.x, e.y, 150, 0);
  if (cur === "passport") B_TRIPS.forEach(function(t, i){ tuck(S.pc, i, S.pcw); });
  S.next = B_TRIPS.length; S.phase = "ending0";
  hint("都飞完了，点一下，领取最后一张登机牌");
}

/* ---------- 切换 ---------- */
function tabs(){
  var t = document.getElementById("tabs"); t.innerHTML = "";
  Object.keys(TABS).forEach(function(k){
    var b = el("button", "pill", t); b.type = "button"; b.textContent = TABS[k].label; b.setAttribute("aria-pressed", k === cur ? "true" : "false");
    b.addEventListener("click", function(){ cur = k; try { localStorage.setItem("trip-end-tab", k); } catch(e) {} tabs(); reset(); });
  });
  document.getElementById("tip").textContent = TABS[cur].tip;
}
function reset(){
  if (S) { S.dead = true; S.timers.forEach(clearTimeout); }
  stage.innerHTML = ""; measure();
  S = {timers:[]}; buildMap();
}
window.addEventListener("resize", function(){ clearTimeout(window.__rz); window.__rz = setTimeout(reset, 150); });
document.getElementById("again").addEventListener("click", reset);
document.getElementById("skip").addEventListener("click", skipToEnd);
tabs(); reset();
</script>
