    var tip = L.filmLeft + S.out * L.k + L.H * .03, maxX = L.W - L.H * .3;
    S.hint.style.left = Math.min(tip, maxX) + "px";
    S.hint.style.top = (tip > maxX ? L.stripTop - L.H * .1 : L.stripTop + L.stripH * .5 - L.H * .035) + "px";
  }
  S.hint.classList.toggle("on", !!on);
}
function idleHint(){
  clearTimeout(S.idle); var me = S;
  S.idle = setTimeout(function(){ if (!me.dead && !drag) showHint(true); }, 6000);
}

/* ---------- 拉 ---------- */
function allowedMax(){ return Math.min(S.maxDev + 1, N - 1); }
function clampSoft(o){
  var lo = outOf(-1), hi = outOf(allowedMax());
  if (o < lo) return lo - Math.pow(lo - o, .8) * .35;
  if (o > hi) return hi + Math.pow(o - hi, .8) * .35;     /* 还没冲洗的那格后面拉不动，只能一格一格来 */
  return o;
}
function goTo(i){
  i = Math.max(-1, Math.min(allowedMax(), i));
  var target = outOf(i), dist = Math.abs(target - S.out) / TW;
  tween(target, 320 + Math.min(1, dist) * 260, easeOutBack, function(){
    if (i !== S.cur || (i >= 0 && !S.dev[i])) clack();
    S.cur = i;
    if (i >= 0 && !S.dev[i]) develop(i);
  });
}
var drag = null;
stage.addEventListener("pointerdown", function(ev){
  ac();
  if (!S || S.busy) return;
  cancelAnimationFrame(S.raf); S.moving = true;
  drag = {x:ev.clientX, o:S.out, hist:[[performance.now(), ev.clientX]], moved:0};
  stage.setPointerCapture(ev.pointerId); stage.classList.add("drag");
  showHint(false); clearTimeout(S.idle);
});
stage.addEventListener("pointermove", function(ev){
  if (!drag) return;
  var dx = ev.clientX - drag.x; drag.moved = Math.max(drag.moved, Math.abs(dx));
  S.out = clampSoft(drag.o + dx / L.k);
  drag.hist.push([performance.now(), ev.clientX]); if (drag.hist.length > 6) drag.hist.shift();
  var h = drag.hist, v = (h[h.length - 1][1] - h[0][1]) / Math.max(16, h[h.length - 1][0] - h[0][0]);
  S.tug = Math.max(-3, Math.min(5, v * 4));          /* 罐子被拽得轻轻晃一下 */
  render();
});
function endDrag(){
  if (!drag) return;
  stage.classList.remove("drag");
  var d = drag; drag = null;
  if (d.moved < 6) { goTo(S.cur + 1); idleHint(); return; }      /* 点一下 = 拉出下一格 */
  var h = d.hist, a = h[0], b = h[h.length - 1], dt = Math.max(16, b[0] - a[0]);
  var v = (b[1] - a[1]) / dt / L.k;                               /* 往右为正 */
  var proj = S.out + v * 170;
  var i = Math.round((proj - BASE) / TW) - 1;
  if (i === S.cur && Math.abs(v) > .25) i += v > 0 ? 1 : -1;      /* 轻轻一甩也能换格 */
  goTo(i); idleHint();
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* 触控板 / 滚轮 / 方向键 */
var wheelAcc = 0, wheelLock = 0;
stage.addEventListener("wheel", function(ev){
  ev.preventDefault(); ac();
  if (!S || S.busy) return;
  var now = performance.now(); if (now < wheelLock) return;
  wheelAcc += Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? -ev.deltaX : ev.deltaY;
  if (Math.abs(wheelAcc) > 40) { goTo(S.cur + (wheelAcc > 0 ? 1 : -1)); wheelAcc = 0; wheelLock = now + 480; showHint(false); idleHint(); }
}, {passive:false});
stage.addEventListener("keydown", function(ev){
  if (!S || S.busy) return;
  if (ev.key === "ArrowRight" || ev.key === " ") { ev.preventDefault(); ac(); goTo(S.cur + 1); showHint(false); idleHint(); }
  if (ev.key === "ArrowLeft") { ev.preventDefault(); ac(); goTo(S.cur - 1); }
});

document.getElementById("again").addEventListener("click", function(){ reset(); });
reset();
</script>

</body></html>
