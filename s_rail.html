    return '<div class="ring" style="left:' + p[0] + "px;top:" + p[1] + 'px"></div><div class="lb" style="' + st + '">' + (NAMES[j] || "") + "</div>"; }).join("") + '<div class="lb on" style="top:' + (P[0][1] + HOME.dy) + "px;right:" + (736 - P[0][0] - HOME.dx) + 'px;color:#2d4a8a">出发 · ' + HOMENAME + "</div>";
  $("log").innerHTML = use.map(function(s, j){ return "<li><b>0" + (j + 1) + "</b>" + (NAMES[j] || "") + "</li>"; }).join("");
  at = 0; busy = false; PH = "ready"; if (MEMO) { MEMO.m.remove(); MEMO = null; } $("veil").classList.remove("on"); put(0); $("hint").textContent = "点一下，开往下一站";
}
function go(){

  var a = at ? LEN[use[at - 1].i] : 0, b = LEN[use[at].i], t0 = performance.now(), dur = 700 + (b - a) * 4.2, k = at;
  (function f(now){ var q = Math.min(1, (now - t0) / dur), e = q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2; put(a + (b - a) * e);
    if (q < 1) requestAnimationFrame(f); else { at++; var lb = $("labels").children; lb[k * 2].classList.add("go"); lb[k * 2 + 1].classList.add("on"); $("log").children[k].classList.add("on");
      setTimeout(function(){ $("veil").classList.add("on"); MEMO = openMemo(k); PH = "memo"; busy = false; }, 450); } })(t0);
}

function tap(){

    PH = "closing"; $("veil").classList.remove("on"); closeMemo(o, function(){ MEMO = null; afterMemo(); }); }
}
$("wrap").addEventListener("pointerdown", function(e){ if (e.target.closest && e.target.closest(".bar")) return; tap(); });
[2, 3, 4].forEach(function(n){ var b = document.createElement("button"); b.type = "button"; b.textContent = n + " 站"; b.dataset.n = n; b.onclick = function(){ N = n; mark(); build(); }; $("ns").appendChild(b); });
(function(){ var h = document.createElement("input"); h.value = HOMENAME; h.title = "出发地"; h.style.borderColor = "#2d4a8a"; h.oninput = function(){ HOMENAME = h.value; build(); }; $("nm").appendChild(h); })();
NAMES.forEach(function(v, i){ var inp = document.createElement("input"); inp.value = v; inp.oninput = function(){ NAMES[i] = inp.value; build(); }; $("nm").appendChild(inp); });

$("again").onclick = build;
